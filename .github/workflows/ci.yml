name: Continuous integration

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install OSV-Scanner
        shell: powershell
        run: winget install --id Google.OSVScanner --exact --source winget --silent --accept-package-agreements --accept-source-agreements
      - name: Scan runtime dependencies
        shell: powershell
        run: .\scripts\run-security-scan.ps1
      - name: Build portable Windows package and test
        shell: powershell
        run: .\scripts\package-windows.ps1 -Type app-image
      - name: Smoke-test packaged application
        shell: powershell
        run: .\scripts\verify-windows-package.ps1 -ApplicationDirectory .\target\installer\Hyperion -SmokeTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
      - name: Upload portable Windows package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-windows-app-image
          path: target/installer/Hyperion
